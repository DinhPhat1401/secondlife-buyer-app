name: secondlife_app_buyer
description: "SecondLife Mobile App for Buyers - Shop, Bargain, Escrow Buy Now & Inspection Tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^17.5.0
  flutter_secure_storage: ^11.2.0
  stomp_dart_client: ^3.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  cached_network_image: ^3.4.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  json_serializable: ^6.14.1
  freezed: ^4.0.0-dev.3
  freezed_annotation: ^3.1.0

flutter:
  uses-material-design: true
